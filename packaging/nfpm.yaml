# nfpm configuration — builds the .deb and .rpm attached to GitHub releases.
# Run from the repo root after staging a release build:
#   meson setup build-pkg --buildtype=release --prefix=/usr
#   meson compile -C build-pkg
#   DESTDIR=$PWD/build-pkg/staging meson install -C build-pkg
#   SKIM_VERSION=x.y.z nfpm package -f packaging/nfpm.yaml -p deb -t dist/
#   SKIM_VERSION=x.y.z nfpm package -f packaging/nfpm.yaml -p rpm -t dist/
#
# Dependency names follow sdr-for-linux's packaging (verified there against
# Ubuntu 24.04/Debian 13 and Fedora 40+), plus FFTW in both precisions: the
# channelizer runs single, WDSP's min-phase FIR designer double. CI
# install-tests both packages in fresh containers and ldd-checks the binary
# before a release artifact is attached, so a renamed distro package fails
# the pipeline instead of the user.

name: skimmer-for-linux
arch: amd64
platform: linux
version: ${SKIM_VERSION}
section: hamradio
priority: optional
maintainer: Richard Fakenberg <rifak@protonmail.com>
vendor: OK1BR
homepage: https://github.com/OK1BR/skimmer-for-linux
license: GPL-3.0-or-later
description: |
  Native GTK4/libadwaita multi-channel CW skimmer.
  Pulls wideband IQ from the TCI server in sdr-for-linux, channelizes the
  segment with a polyphase filter bank and decodes every signal in it at
  once: soft-decision Viterbi CW decoder with fist model, clock re-lock and
  tone splitter, RBN-grade callsign validation, spots back to the radio
  panadapter and out over a CW-Skimmer-dialect telnet cluster feed for
  local loggers. Read-only against the radio.

contents:
  - src: build-pkg/staging/usr/bin/skimmer-for-linux
    dst: /usr/bin/skimmer-for-linux
  - src: build-pkg/staging/usr/share/applications/cz.ok1br.skimmer_for_linux.desktop
    dst: /usr/share/applications/cz.ok1br.skimmer_for_linux.desktop
  - src: build-pkg/staging/usr/share/icons/hicolor/scalable/apps/cz.ok1br.skimmer_for_linux.svg
    dst: /usr/share/icons/hicolor/scalable/apps/cz.ok1br.skimmer_for_linux.svg
  - src: build-pkg/staging/usr/share/metainfo/cz.ok1br.skimmer_for_linux.metainfo.xml
    dst: /usr/share/metainfo/cz.ok1br.skimmer_for_linux.metainfo.xml

overrides:
  deb:
    # Ubuntu 24.04+ / Debian 13+ (the t64 names post 64-bit time_t transition)
    depends:
      - libc6 (>= 2.39)
      - libgtk-4-1
      - libadwaita-1-0 (>= 1.5)
      - libglib2.0-0t64
      - libwebsockets19t64
      - libfftw3-single3
      - libfftw3-double3
  rpm:
    # Fedora 40+
    depends:
      - gtk4
      - libadwaita >= 1.5
      - glib2
      - libwebsockets
      - fftw-libs-single
      - fftw-libs-double
